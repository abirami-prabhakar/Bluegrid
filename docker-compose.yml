services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bluegrid
      POSTGRES_PASSWORD: bluegrid
      POSTGRES_DB: bluegrid
    ports:
      - "5432:5432"
    volumes:
      - bluegrid_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluegrid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bluegrid_pg:
